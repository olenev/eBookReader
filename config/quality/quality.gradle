/**
 * Set up Checkstyle and PMD to perform static code analysis.
 *
 * Gradle tasks added:
 * - checkstyle
 * - pmd
 *
 * Both tasks are added as dependencies of the check task.
 *
 * NOTE: FindBugs was removed - the Gradle FindBugs plugin was dropped in Gradle 6.0
 * and the upstream project is dead. Use SpotBugs instead if bytecode analysis is needed.
 */

apply plugin: 'checkstyle'
apply plugin: 'pmd'

checkstyle {
    toolVersion = '10.12.4'
    ignoreFailures = true
}

pmd {
    toolVersion = '6.55.0'
    ignoreFailures = true
}

def qualityConfigDir = "$project.rootDir/config/quality"
def reportsDir = "${project.layout.buildDirectory.get()}/reports"

check.dependsOn 'checkstyle', 'pmd'

task checkstyle(type: Checkstyle, group: 'Verification', description: 'Runs code style checks') {
    configFile file("$qualityConfigDir/checkstyle/checkstyle-config.xml")
    source 'src'
    include '**/*.java'

    reports {
        xml.required = true
        xml.outputLocation = file("$reportsDir/checkstyle/checkstyle.xml")
    }

    classpath = files()
}

task pmd(type: Pmd, group: 'Verification', description: 'Inspect sourcecode for bugs') {
    ruleSetFiles = files("$qualityConfigDir/pmd/pmd-ruleset.xml")
    ruleSets = []

    source 'src'
    include '**/*.java'
    exclude '**/gen/**'

    reports {
        xml.required = true
        xml.outputLocation = file("$reportsDir/pmd/pmd.xml")
        html.required = true
        html.outputLocation = file("$reportsDir/pmd/pmd.html")
    }
}
